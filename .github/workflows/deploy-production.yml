name: AR3D AI Calling - guarded main auto deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AR3D_MAIN_ONLY (this only targets the new AR3D AI Calling Worker)'
        required: true
        type: string
      operation:
        description: 'Preflight first, initialize empty D1 databases once, then deploy'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - initialize
          - deploy

permissions:
  contents: read

concurrency:
  group: ar3d-ai-calling-main-deployment
  cancel-in-progress: false

jobs:
  main:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'AR3D_MAIN_ONLY')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_DB_ID: ${{ secrets.AR3D_MAIN_CONTROL_DB_ID }}
      CRM_DB_ID: ${{ secrets.AR3D_MAIN_CRM_DB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full automated tests
        run: npm test
      # Green Node/Python CI must finish BEFORE any remote write. This step
      # verifies both D1 identities + private R2 bucket and writes a non-committed
      # Wrangler config. Main pushes choose auto; manual operations remain for recovery.
      - name: Plan isolated main operation; verify both D1 and R2 identities
        id: schema
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] || [ "$MANUAL_OPERATION" = preflight ]; then
            node scripts/main-cloudflare.mjs preflight
          elif [ "$MANUAL_OPERATION" = initialize ]; then
            node scripts/main-cloudflare.mjs fresh
          elif [ "$MANUAL_OPERATION" = deploy ]; then
            node scripts/main-cloudflare.mjs ready
          else
            echo "::error::Unsupported operation"; exit 1
          fi
      # Isolated Calling CRM v10: immutable blocked intent proposal records.
      # Never touches leads, dial triggers, provider credentials or other apps.
      - name: Upgrade isolated Calling CRM blocked intent proposals only
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'crm_call_intent_upgrade'
        run: |
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0010_call_intent_proposals.sql
      - name: Add scripted call results to the isolated Calling CRM
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'crm_scripted_results_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0013_scripted_call_results.sql
      - name: Add verified-phone pilot audit to Calling Control D1
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_scripted_pilot_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0016_scripted_phone_pilots.sql
      - name: Add private client company change requests to Calling Control D1
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_company_change_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0015_company_change_requests.sql
      - name: Add isolated Calling Control client contact accounts
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_client_accounts_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0014_client_accounts.sql
      - name: Add dedicated client agent publications
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_publication_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0013_agent_publications.sql
      - name: Add versioned company business profiles
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_profile_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0012_company_profiles.sql
      - name: Add versioned client conversation scripts
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_script_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0011_calling_scripts.sql
      - name: Add isolated Calling campaign queue (dispatch remains opt-in)
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'crm_dispatch_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0011_scripted_campaign_dispatch.sql
      # These exact isolated Calling-only migrations are additive: new tables,
      # no modifications to existing customer/lead data. The preflight verifies
      # the D1 names, all other tables and CRM safety triggers before allowing.
      - name: Create isolated Calling Control provisional credit tables
        if: github.event_name == 'push' && contains(fromJSON('["control_credit_upgrade","credit_staff_upgrade","credit_cdr_upgrade","credit_staff_cdr_upgrade"]'), steps.schema.outputs.schema_state)
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0020_client_credit_planning.sql
      - name: Create isolated Calling Control immutable minute ledger
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_minute_ledger_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0021_tenant_minute_ledger.sql
      - name: Create isolated Calling atomic provider reservations
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_provider_reserve_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0026_provider_cost_reservations.sql
      - name: Create isolated Calling provider safety history
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_provider_safety_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0025_provider_safety_events.sql
      - name: Create isolated Calling atomic client credit purchases
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_credit_purchase_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0024_tenant_credit_purchases.sql
      - name: Create isolated Calling provider financial journal
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_provider_journal_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0023_provider_financial_journal.sql
      - name: Create isolated Calling Control minute holds
        if: github.event_name == 'push' && steps.schema.outputs.schema_state == 'control_minute_holds_upgrade'
        run: npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0022_tenant_minute_holds.sql
      - name: Create isolated Calling CRM staff assignment table
        if: github.event_name == 'push' && contains(fromJSON('["crm_staff_upgrade","credit_staff_upgrade","crm_staff_cdr_upgrade","credit_staff_cdr_upgrade"]'), steps.schema.outputs.schema_state)
        run: npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0020_lead_staff_assignments.sql
      - name: Create isolated Calling CRM verified CDR observation ledger
        if: github.event_name == 'push' && contains(fromJSON('["crm_cdr_upgrade","crm_staff_cdr_upgrade","credit_cdr_upgrade","credit_staff_cdr_upgrade"]'), steps.schema.outputs.schema_state)
        run: npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0021_verified_provider_call_costs.sql
      # Never auto-migrate partial or mixed schemas. Re-check the EMPTY state
      # immediately before writing, even if the previous read said fresh.
      - name: Confirm both isolated D1 schemas are still empty
        if: (github.event_name == 'push' && steps.schema.outputs.schema_state == 'fresh') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'initialize')
        run: node scripts/main-cloudflare.mjs fresh
      - name: Initialize NEW AR3D Calling Control D1 database
        if: (github.event_name == 'push' && steps.schema.outputs.schema_state == 'fresh') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'initialize')
        run: |
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0001_init.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0002_human_access.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0003_ip_login_limits.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0004_super_admin_mfa.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0005_mfa_recovery.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0006_tenant_lifecycle.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0007_provider_inbox.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0011_calling_scripts.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0012_company_profiles.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0013_agent_publications.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0014_client_accounts.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0015_company_change_requests.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0016_scripted_phone_pilots.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0020_client_credit_planning.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0021_tenant_minute_ledger.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0022_tenant_minute_holds.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0023_provider_financial_journal.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0024_tenant_credit_purchases.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0025_provider_safety_events.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0026_provider_cost_reservations.sql
      - name: Initialize NEW AR3D Calling Shared CRM D1 database
        if: (github.event_name == 'push' && steps.schema.outputs.schema_state == 'fresh') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'initialize')
        run: |
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0001_init.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0002_lead_workflow.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0003_conversation_simulator.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0004_lead_opt_out.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0005_consent_evidence.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0006_campaign_drafts.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0007_agent_safety.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0008_customer_qualification.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0010_call_intent_proposals.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0011_scripted_campaign_dispatch.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0013_scripted_call_results.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0020_lead_staff_assignments.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0021_verified_provider_call_costs.sql
      - name: Verify post-initialization schema before proceeding
        if: (github.event_name == 'push' && steps.schema.outputs.schema_state == 'fresh') || (github.event_name == 'workflow_dispatch' && inputs.operation == 'initialize')
        run: node scripts/main-cloudflare.mjs ready
      # On every main push, fresh schemas are created once or an already
      # ready schema is reused. Final checked state MUST be ready before deploy.
      - name: Recheck complete safety triggers, columns and identities before deploy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        run: node scripts/main-cloudflare.mjs ready
      # Diagnostic only: latest internal test state, no PII or raw records.
      - name: Inspect latest internal pilot state and CRM save (read only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        continue-on-error: true
        run: node scripts/inspect-internal-pilot.mjs
      # Do not publish over a Worker whose login/MFA bindings are absent.
      # One narrowly guarded recovery can restore the exact previously green
      # Worker version, then stop instead of silently deploying fresh code.
      - name: Verify isolated auth secrets and recover last verified version if necessary
        id: auth
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        run: node scripts/guarded-worker-recovery.mjs
      - name: Deploy only the new AR3D AI Calling Worker
        id: publish
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')) && steps.auth.outputs.recovered != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --keep-vars --config wrangler.jsonc 2>&1 | tee /tmp/ar3d-calling-wrangler-deploy.log
          # Wrangler's published workers.dev URL is non-secret; never construct
          # a URL from Cloudflare credentials or accept unrelated Worker names.
          URL="$(grep -Eo 'https://ar3d-ai-calling\.[a-z0-9-]+\.workers\.dev/?' /tmp/ar3d-calling-wrangler-deploy.log | head -n 1 || true)"
          if [ -z "$URL" ]; then
            echo "::warning::No verified Worker URL found in Wrangler output; run read-only smoke manually."
          else
            echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          fi
      - name: Inspect isolated Worker secret binding names (never values)
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')) && steps.auth.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/inspect-main-secrets.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::error::Authentication secrets unverified after deploy; manual rollback required"
          exit 1
      - name: Read-only smoke test on deployed isolated Worker
        if: steps.publish.outputs.worker_url != ''
        shell: bash
        env:
          WORKER_URL: ${{ steps.publish.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-main.mjs "$WORKER_URL"; then exit 0; fi
            sleep 5
          done
          echo "::error::Read-only isolated Worker smoke failed"; exit 1
      - name: Read-only custom domain smoke (including sidebar assets and auth gate)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy')
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-main.mjs 'https://aicalling.ar3dstudio.in'; then exit 0; fi
            sleep 5
          done
          echo "::error::Custom Calling domain smoke failed"; exit 1

      - name: Mark rollback-only recovery as not a new release
        if: steps.auth.outputs.recovered == 'true'
        run: |
          echo "::error::Previous verified Worker was restored; the new main release has NOT been deployed."
          exit 1
