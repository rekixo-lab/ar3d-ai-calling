name: AR3D AI Calling - main Cloudflare setup (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AR3D_MAIN_ONLY (this only targets the new AR3D AI Calling Worker)'
        required: true
        type: string
      operation:
        description: 'Preflight first, initialize empty D1 databases once, then deploy'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - initialize
          - deploy

permissions:
  contents: read

concurrency:
  group: ar3d-ai-calling-main-deployment
  cancel-in-progress: false

jobs:
  main:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'AR3D_MAIN_ONLY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_DB_ID: ${{ secrets.AR3D_MAIN_CONTROL_DB_ID }}
      CRM_DB_ID: ${{ secrets.AR3D_MAIN_CRM_DB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run full automated tests
        run: npm test
      - name: Verify main resource identity and schema state; generate non-committed Worker configuration
        run: |
          if [ '${{ inputs.operation }}' = initialize ]; then
            node scripts/main-cloudflare.mjs fresh
          elif [ '${{ inputs.operation }}' = deploy ]; then
            node scripts/main-cloudflare.mjs ready
          else
            node scripts/main-cloudflare.mjs preflight
          fi
      # Runs ONLY after an explicit manual initialize selection and strict
      # empty-schema checks. The workflow never initializes the AR3D Platform
      # or Engine databases, and it cannot repeat on an initialized database.
      - name: Initialize NEW AR3D Calling Control D1 database
        if: inputs.operation == 'initialize'
        run: |
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0001_init.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0002_human_access.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0003_ip_login_limits.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0004_super_admin_mfa.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-control --remote --yes --config wrangler.jsonc --file migrations/control/0005_mfa_recovery.sql
      - name: Initialize NEW AR3D Calling Shared CRM D1 database
        if: inputs.operation == 'initialize'
        run: |
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0001_init.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0002_lead_workflow.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0003_conversation_simulator.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0004_lead_opt_out.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0005_consent_evidence.sql
          npx --yes wrangler@4 d1 execute ar3d-calling-shared-crm --remote --yes --config wrangler.jsonc --file migrations/crm/0006_campaign_drafts.sql
      - name: Verify post-initialization schema before proceeding
        if: inputs.operation == 'initialize'
        run: node scripts/main-cloudflare.mjs ready
      - name: Deploy only the new AR3D AI Calling Worker
        if: inputs.operation == 'deploy'
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
