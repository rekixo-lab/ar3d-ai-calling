name: AR3D AI Calling — deploy staging (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_STAGING_ONLY to enable the staging deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ar3d-ai-calling-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_STAGING_ONLY'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_DB_ID: ${{ secrets.AR3D_STAGING_CONTROL_DB_ID }}
      CRM_DB_ID: ${{ secrets.AR3D_STAGING_CRM_DB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all tests
        run: npm test
      - name: Verify staging-only credentials and generate private config
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN||'';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||'';
          const control=process.env.CONTROL_DB_ID||'';
          const crm=process.env.CRM_DB_ID||'';
          const uuid=/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i;
          if(!token||!uuid.test(account)||!uuid.test(control)||!uuid.test(crm)||control===crm)
            throw Error('Missing or invalid staging secrets');
          const config=JSON.parse(readFileSync('wrangler.staging.example.jsonc','utf8'));
          config.d1_databases[0].database_id=control;
          config.d1_databases[1].database_id=crm;
          writeFileSync('wrangler.staging.jsonc',JSON.stringify(config,null,2));
          NODE
          npm run check:staging
      # Staging databases and migrations must already exist; this job does not
      # create/update any D1 schema or provision telecom numbers.
      - name: Deploy staging Worker only
        run: npx --yes wrangler@4 deploy --config wrangler.staging.jsonc
